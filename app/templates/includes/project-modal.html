<div class="modal fade" id="projectModal" aria-hidden="true" style="display: none;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="addnewgraphLabel">Add project</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="mt-3">
                <label>Project name</label>
                <input class="form-control" id="project_name" name="project_name" type="text" value="">
                <small class="form-text text-muted">Only alphanumeric characters and underscores are allowed.</small>
              </div>
              <div class="form-check mt-3">
                <input class="form-check-input" type="checkbox" id="create_examples" name="create_examples">
                <label class="form-check-label" for="create_examples">Create configuration examples</label>
              </div>
              <div class="alert alert-danger mt-3" id="project_error" style="display: none;"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                <button class="btn btn-primary" id="saveProject" type="button">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Import Modal -->
<div class="modal fade" id="importModal" aria-hidden="true" style="display: none;">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Import project configuration</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Step 1: file + target project selection -->
                <div id="importStep1">
                    <div class="mt-3">
                        <label class="form-label">Export file (JSON)</label>
                        <input class="form-control" id="import_file" name="import_file" type="file" accept=".json">
                    </div>
                    <div class="mt-3">
                        <label class="form-label">Target project</label>
                        <select class="form-select" id="import_project_id">
                            <option value="">— Select a project —</option>
                        </select>
                    </div>
                    <div class="alert alert-danger mt-3" id="import_error_step1" style="display: none;"></div>
                </div>

                <!-- Step 2: conflict review + confirmation -->
                <div id="importStep2" style="display: none;">
                    <div class="alert alert-warning" id="import_no_conflicts" style="display: none;">
                        No conflicts found. Click <strong>Import</strong> to proceed.
                    </div>
                    <div id="import_conflicts_section" style="display: none;">
                        <div class="alert alert-warning">
                            <strong>Warning:</strong> The following items already exist and will be <strong>overridden</strong>:
                        </div>
                        <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                            <table class="table table-sm table-bordered">
                                <thead><tr><th>Type</th><th>Name</th></tr></thead>
                                <tbody id="import_conflicts_table"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="alert alert-danger mt-3" id="import_error_step2" style="display: none;"></div>
                </div>

                <!-- Step 3: success -->
                <div id="importStep3" style="display: none;">
                    <div class="alert alert-success">
                        Import completed successfully!
                    </div>
                    <ul id="import_summary_list" class="list-group"></ul>
                </div>
            </div>
            <div class="modal-footer" id="importModalFooter">
                <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>
                <button class="btn btn-primary" id="importCheckBtn" type="button">Check conflicts</button>
                <button class="btn btn-danger" id="importConfirmBtn" type="button" style="display: none;">Import (override)</button>
                <button class="btn btn-primary" id="importNoConflictsBtn" type="button" style="display: none;">Import</button>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        // ---- New Project modal ----
        // Check if event listener is already attached to avoid duplicates
        if (!window.projectModalInitialized) {
            window.projectModalInitialized = true;

            var modal = $('#projectModal');
            const saveProject = document.getElementById("saveProject");
            const projectError = document.getElementById("project_error");

            // Remove any existing event listeners
            saveProject.replaceWith(saveProject.cloneNode(true));

            // Get the fresh reference after replacement
            const newSaveProject = document.getElementById("saveProject");

            // Reset error message when modal is opened
            modal.on('show.bs.modal', function() {
                document.getElementById("project_name").value = "";
                projectError.style.display = "none";
                projectError.textContent = "";
            });

            // Add the event listener
            newSaveProject.addEventListener('click', (event) => {
                console.log("Save project button clicked");
                let projectName_value = document.getElementById("project_name").value;
                let createExamples = document.getElementById("create_examples").checked;

                // Validate project name - only allow alphanumeric and underscore
                if (!/^[a-zA-Z0-9_]+$/.test(projectName_value)) {
                    projectError.style.display = "block";
                    projectError.textContent = "Project name can only contain letters, numbers, and underscores.";
                    return;
                }

                // Show loading state
                newSaveProject.disabled = true;
                newSaveProject.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Saving...';

                if (projectName_value.length > 0) {
                    // Use the API client instead of direct AJAX call
                    apiClient.projects.create({
                        id: null,
                        name: projectName_value,
                        create_examples: createExamples
                    })
                    .then(response => {
                        console.log("Project created successfully:", response);

                        // Reset active project cookies to the newly created project
                        try {
                            const newProjectId = (response && response.data && response.data.project_id) || (response && response.project_id);
                            if (newProjectId) {
                                document.cookie = `project=${newProjectId}; path=/`;
                                // Use the entered name as the cookie value
                                document.cookie = `project_name=${encodeURIComponent(projectName_value)}; path=/`;
                            }
                        } catch (e) {
                            console.warn('Could not set active project cookies after creation:', e);
                        }

                        // Hide the modal
                        modal.modal('hide');

                        // Show success message using showFlashMessage
                        showFlashMessage("Project created successfully", "success");

                        // Redirect after a short delay to allow the message to be seen
                        setTimeout(() => {
                            window.location.replace("/");
                        }, 1000);
                    })
                    .catch(error => {
                        console.error("Request failed:", error);

                        // Reset button state
                        newSaveProject.disabled = false;
                        newSaveProject.innerHTML = 'Save';

                        // Get error message
                        let errorMessage = 'Failed to create project. Please try again.';
                        if (error.errors && error.errors.length > 0) {
                            errorMessage = error.errors[0].message;
                        } else if (error.message) {
                            errorMessage = error.message;
                        }

                        // Show error in the modal
                        projectError.style.display = "block";
                        projectError.textContent = errorMessage;

                        // Also show error using showFlashMessage
                        showFlashMessage(errorMessage, "error");
                    });
                } else {
                    // Reset button state
                    newSaveProject.disabled = false;
                    newSaveProject.innerHTML = 'Save';

                    // Show error for empty name
                    projectError.style.display = "block";
                    projectError.textContent = "Project name cannot be empty.";
                }
            });
        }

        // ---- Import modal ----
        if (!window.importModalInitialized) {
            window.importModalInitialized = true;

            const importModal = $('#importModal');
            let importData = null;   // parsed JSON payload
            let importConflicts = [];

            // Populate project selector when modal opens
            importModal.on('show.bs.modal', function () {
                _resetImportModal();
                apiClient.projects.getAll().then(resp => {
                    const projects = (resp && resp.data && resp.data.projects) || [];
                    const sel = document.getElementById('import_project_id');
                    // Keep the placeholder, rebuild options
                    sel.innerHTML = '<option value="">— Select a project —</option>';
                    projects.forEach(p => {
                        const opt = document.createElement('option');
                        opt.value = p.id;
                        opt.textContent = p.name;
                        sel.appendChild(opt);
                    });
                }).catch(() => {});
            });

            // "Check conflicts" button
            document.getElementById('importCheckBtn').addEventListener('click', function () {
                const fileInput = document.getElementById('import_file');
                const projectId = document.getElementById('import_project_id').value;
                const errEl = document.getElementById('import_error_step1');

                if (!fileInput.files || fileInput.files.length === 0) {
                    errEl.style.display = 'block';
                    errEl.textContent = 'Please select a JSON export file.';
                    return;
                }
                if (!projectId) {
                    errEl.style.display = 'block';
                    errEl.textContent = 'Please select a target project.';
                    return;
                }
                errEl.style.display = 'none';

                const btn = this;
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Checking…';

                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                formData.append('project_id', projectId);

                apiClient.projects.importCheck(formData)
                    .then(resp => {
                        importConflicts = (resp && resp.data && resp.data.conflicts) || [];
                        _showImportStep2(importConflicts);
                    })
                    .catch(err => {
                        errEl.style.display = 'block';
                        errEl.textContent = (err && err.message) || 'Failed to check conflicts.';
                    })
                    .finally(() => {
                        btn.disabled = false;
                        btn.innerHTML = 'Check conflicts';
                    });
            });

            // "Import (override)" button (conflicts present, user confirms)
            document.getElementById('importConfirmBtn').addEventListener('click', function () {
                _executeImport(true);
            });

            // "Import" button (no conflicts)
            document.getElementById('importNoConflictsBtn').addEventListener('click', function () {
                _executeImport(true);
            });

            function _executeImport(confirmed) {
                const fileInput = document.getElementById('import_file');
                const projectId = document.getElementById('import_project_id').value;
                const errEl = document.getElementById('import_error_step2');
                errEl.style.display = 'none';

                const activeBtn = importConflicts.length > 0
                    ? document.getElementById('importConfirmBtn')
                    : document.getElementById('importNoConflictsBtn');
                activeBtn.disabled = true;
                activeBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Importing…';

                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                formData.append('project_id', projectId);
                formData.append('confirmed', confirmed ? 'true' : 'false');

                apiClient.projects.importExecute(formData)
                    .then(resp => {
                        const summary = (resp && resp.data && resp.data.summary) || {};
                        _showImportStep3(summary);
                    })
                    .catch(err => {
                        errEl.style.display = 'block';
                        errEl.textContent = (err && err.message) || 'Import failed.';
                        activeBtn.disabled = false;
                        activeBtn.innerHTML = importConflicts.length > 0 ? 'Import (override)' : 'Import';
                    });
            }

            function _showImportStep2(conflicts) {
                document.getElementById('importStep1').style.display = 'none';
                document.getElementById('importStep2').style.display = 'block';
                document.getElementById('importCheckBtn').style.display = 'none';

                if (conflicts.length === 0) {
                    document.getElementById('import_no_conflicts').style.display = 'block';
                    document.getElementById('import_conflicts_section').style.display = 'none';
                    document.getElementById('importNoConflictsBtn').style.display = 'inline-block';
                } else {
                    document.getElementById('import_no_conflicts').style.display = 'none';
                    document.getElementById('import_conflicts_section').style.display = 'block';
                    document.getElementById('importConfirmBtn').style.display = 'inline-block';

                    const tbody = document.getElementById('import_conflicts_table');
                    tbody.innerHTML = '';
                    conflicts.forEach(c => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${_escHtml(c.type)}</td><td>${_escHtml(c.name)}</td>`;
                        tbody.appendChild(tr);
                    });
                }
            }

            function _showImportStep3(summary) {
                document.getElementById('importStep2').style.display = 'none';
                document.getElementById('importStep3').style.display = 'block';
                document.getElementById('importConfirmBtn').style.display = 'none';
                document.getElementById('importNoConflictsBtn').style.display = 'none';

                const ul = document.getElementById('import_summary_list');
                ul.innerHTML = '';
                const labels = {
                    secrets: 'Secrets', prompts: 'Prompts', nfrs: 'NFRs',
                    grafana: 'Grafana integrations', influxdb: 'InfluxDB integrations',
                    graphs: 'Graphs', templates: 'Templates',
                    template_groups: 'Template Groups', settings: 'Settings'
                };
                Object.entries(summary).forEach(([key, count]) => {
                    if (count > 0) {
                        const li = document.createElement('li');
                        li.className = 'list-group-item d-flex justify-content-between';
                        li.innerHTML = `<span>${labels[key] || key}</span><span class="badge bg-success">${count}</span>`;
                        ul.appendChild(li);
                    }
                });
            }

            function _resetImportModal() {
                importData = null;
                importConflicts = [];
                document.getElementById('importStep1').style.display = 'block';
                document.getElementById('importStep2').style.display = 'none';
                document.getElementById('importStep3').style.display = 'none';
                document.getElementById('import_file').value = '';
                document.getElementById('import_project_id').value = '';
                document.getElementById('import_error_step1').style.display = 'none';
                document.getElementById('import_error_step2').style.display = 'none';
                document.getElementById('import_conflicts_table').innerHTML = '';
                document.getElementById('importCheckBtn').style.display = 'inline-block';
                document.getElementById('importConfirmBtn').style.display = 'none';
                document.getElementById('importNoConflictsBtn').style.display = 'none';
            }

            function _escHtml(str) {
                const d = document.createElement('div');
                d.appendChild(document.createTextNode(str || ''));
                return d.innerHTML;
            }
        }
    });
</script>
